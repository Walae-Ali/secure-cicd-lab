name: CI-Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. Build + tests unitaires
  # ---------------------------------------------------------------
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

  # ---------------------------------------------------------------
  # 2. SAST : analyse statique du code (Semgrep)
  #    --error  => code de sortie non nul si un résultat est trouvé
  #    --severity ERROR => on ne bloque que sur les failles sérieuses
  # ---------------------------------------------------------------
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan (bloque sur ERROR et WARNING)
        run: >
          semgrep scan 
            --config p/owasp-top-ten 
            --config p/javascript 
            --config p/nodejs 
            --severity ERROR 
            --severity WARNING 
            --error 
            src/

  # ---------------------------------------------------------------
  # 3. SCA : dépendances vulnérables + secrets (Trivy)
  #    Bloque sur HIGH et CRITICAL
  # ---------------------------------------------------------------
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy - scan des dépendances et des secrets
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------
  # 4. DAST : scan dynamique (OWASP ZAP) sur un environnement éphémère
  #    L'appli tourne dans Docker le temps du job, puis tout est détruit.
  # ---------------------------------------------------------------
  dast:
    runs-on: ubuntu-latest
    needs: [build-test, sast, sca]
    steps:
      - uses: actions/checkout@v4

      - name: Build et démarrage de l'appli (environnement éphémère)
        run: |
          docker build -t app-under-test .
          docker network create zapnet
          docker run -d --name app --network zapnet -p 3000:3000 app-under-test
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break || sleep 2
          done
          curl -sf http://localhost:3000/health

      - name: Scan ZAP baseline
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network zapnet -v "$(pwd)/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://app:3000 -J report.json -r report.html || true

      - name: Échec si alerte HIGH
        run: |
          HIGH=$(jq '[.site[].alerts[] | select(.riskcode=="3")] | length' zap-out/report.json)
          echo "Alertes HIGH : $HIGH"
          [ "$HIGH" -eq 0 ]

      - name: Publier le rapport ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-out/

      - name: Nettoyage
        if: always()
        run: docker rm -f app
